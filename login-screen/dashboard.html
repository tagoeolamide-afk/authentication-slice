<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · shrink</title>
    <link rel="preload" href="fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- The server only serves this page with a valid session (see server/index.ts). -->
  <body data-page="dashboard" data-fit="dashboard">
    <main class="page">
      <div class="dashboard">
        <h1 class="dashboard__text">Signed in as <span id="user-name"></span></h1>
        <button class="button dashboard__button" type="button" id="sign-out" data-label="Sign out" data-pending="Signing out…">
          Sign out
        </button>
      </div>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
